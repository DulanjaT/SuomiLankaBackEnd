services:
  postgres:
    image: postgres:17
    container_name: client-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: client_user
      POSTGRES_PASSWORD: client_password
      POSTGRES_DB: client_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: client-backend
    restart: unless-stopped

    ports:
      - "3001:3001"

    environment:
      PORT: 3001
      DATABASE_URL: postgresql://client_user:client_password@postgres:5432/client_db

    depends_on:
      - postgres

volumes:
  postgres_data: